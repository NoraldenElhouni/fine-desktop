name: Publish

on:
  push:
    tags:
      - "v*.*.*" # triggers on tags like v1.0.0
  workflow_dispatch: # allows manual trigger from the Actions tab

jobs:
  publish:
    permissions:
      contents: write # <-- required to create releases/upload assets
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Windows: ensure Visual Studio 2022 and C++ workload are configured for node-gyp
      - name: Setup Visual Studio (Windows)
        if: runner.os == 'Windows'
        uses: visualstudio/setup-vs@v2
        with:
          version: '2022'
          components: |
            Microsoft.VisualStudio.Workload.NativeDesktop
            Microsoft.VisualStudio.Component.VC.Tools.x86.x64

      # ensure node-gyp will target the installed VS
      - name: Configure node-gyp / npm for MSVC
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm config set msvs_version 2022 --global
          echo "GYP_MSVS_VERSION=2022" >> $GITHUB_ENV
          echo "npm_config_build_from_source=false" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      # Rebuild native modules (e.g. better-sqlite3) against the specific Electron version
      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild

      - name: Publish
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
